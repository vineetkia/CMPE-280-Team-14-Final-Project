<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Inter Tight', system-ui, sans-serif">
  <style>
    .bg { fill: #f4f1ea; }
    .paper { fill: #fbf8f1; stroke: #15140f1a; stroke-width: 1; }
    .ink { fill: #15140f; }
    .ink-2 { fill: #2a2722; }
    .ink-3 { fill: #555048; }
    .ink-4 { fill: #8a857a; }
    .accent { fill: #9c4a2c; }
    .positive { fill: #3f5c3a; }
    .info { fill: #3a4f6e; }
    .hairline { stroke: #15140f1a; stroke-width: 1; fill: none; }
    .hairline-strong { stroke: #15140f44; stroke-width: 1.1; fill: none; }
    .ink-stroke { stroke: #15140f; stroke-width: 1; fill: none; }
    .accent-stroke { stroke: #9c4a2c; stroke-width: 1.4; fill: none; }
    .info-stroke { stroke: #3a4f6e; stroke-width: 1.3; fill: none; }
    .positive-stroke { stroke: #3f5c3a; stroke-width: 1.3; fill: none; }
    .serif { font-family: 'Fraunces', Georgia, serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
    .eyebrow { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; fill: #8a857a; }
    .label { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase; fill: #555048; }
    .label-bg { fill: #f4f1ea; }
    .title { font-family: 'Fraunces', Georgia, serif; font-size: 16px; font-weight: 500; letter-spacing: -0.015em; fill: #15140f; }
    .body { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; font-size: 11px; fill: #2a2722; }
    .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: 0.16em; fill: #8a857a; }
  </style>

  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15140f66"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9c4a2c"/>
    </marker>
    <marker id="arrow-info" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3a4f6e"/>
    </marker>
    <marker id="arrow-positive" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3f5c3a"/>
    </marker>
  </defs>

  <rect width="1280" height="800" class="bg"/>

  <!-- Title -->
  <text x="48" y="44" class="eyebrow">№ 03 · System architecture</text>
  <text x="48" y="86" class="serif" font-size="36" font-weight="400" letter-spacing="-0.025em" fill="#15140f">
    Six services, <tspan font-style="italic" fill="#9c4a2c">one stack</tspan>.
  </text>
  <line x1="48" y1="108" x2="1232" y2="108" class="ink-stroke"/>

  <!-- ══════════════════════════════════════════════════════════════════
       ROW 1 (y=148–224)  —  Data plane:  Browser → Kong → {GoTrue, PostgREST} → Postgres
       Columns: 48–248 / 296–496 / 544–744 / 792–992
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Browser -->
  <g>
    <rect x="48" y="148" width="200" height="84" rx="14" class="paper"/>
    <text x="64" y="174" class="num">CLIENT</text>
    <text x="64" y="198" class="title">Browser</text>
    <text x="64" y="216" class="body" fill="#555048">Next.js 15 · React 18 · dnd-kit</text>
  </g>

  <!-- arrow Browser → Kong -->
  <line x1="248" y1="190" x2="296" y2="190" class="hairline-strong" marker-end="url(#arrow-ink)"/>
  <rect x="256" y="178" width="34" height="12" class="label-bg"/>
  <text x="258" y="187" class="label">https</text>

  <!-- Kong -->
  <g>
    <rect x="296" y="148" width="200" height="84" rx="14" class="paper"/>
    <text x="312" y="174" class="num">№ 01 · GATEWAY</text>
    <text x="312" y="198" class="title">Kong 3.7</text>
    <text x="312" y="216" class="body" fill="#555048">/auth/v1 · /rest/v1 routing</text>
  </g>

  <!-- arrow Kong → GoTrue -->
  <line x1="496" y1="178" x2="544" y2="178" class="hairline-strong" marker-end="url(#arrow-ink)"/>
  <rect x="504" y="166" width="36" height="12" class="label-bg"/>
  <text x="506" y="175" class="label">/auth</text>

  <!-- arrow Kong → PostgREST  (right edge, then down to PostgREST top) -->
  <path d="M 496 202 L 520 202 L 520 360 L 544 360" class="hairline-strong" marker-end="url(#arrow-ink)"/>
  <rect x="524" y="278" width="36" height="12" class="label-bg"/>
  <text x="526" y="287" class="label">/rest</text>

  <!-- GoTrue -->
  <g>
    <rect x="544" y="148" width="200" height="84" rx="14" class="paper"/>
    <text x="560" y="174" class="num">№ 02 · AUTH</text>
    <text x="560" y="198" class="title">GoTrue</text>
    <text x="560" y="216" class="body" fill="#555048">JWT · email + password</text>
  </g>

  <!-- arrow GoTrue → Postgres (auth schema) -->
  <line x1="744" y1="190" x2="792" y2="190" class="hairline-strong" marker-end="url(#arrow-ink)"/>
  <rect x="746" y="178" width="44" height="12" class="label-bg"/>
  <text x="748" y="187" class="label">auth sql</text>

  <!-- Postgres -->
  <g>
    <rect x="792" y="148" width="200" height="84" rx="14" class="paper"/>
    <text x="808" y="174" class="num">№ 04 · DATABASE</text>
    <text x="808" y="198" class="title">Postgres 16</text>
    <text x="808" y="216" class="body" fill="#555048">5 tables · RLS · auth schema</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       ROW 2 (y=320–404)  —  PostgREST sits in the data lane below Kong/GoTrue,
                              so the two arrows from Kong and Web both reach it
                              without crossing other nodes.
       ══════════════════════════════════════════════════════════════════ -->

  <!-- PostgREST -->
  <g>
    <rect x="544" y="320" width="200" height="84" rx="14" class="paper"/>
    <text x="560" y="346" class="num">№ 03 · DATA API</text>
    <text x="560" y="370" class="title">PostgREST</text>
    <text x="560" y="388" class="body" fill="#555048">RLS-scoped REST · v1 spec</text>
  </g>

  <!-- arrow PostgREST → Postgres -->
  <path d="M 744 360 L 770 360 L 770 232 L 850 232" class="hairline-strong" marker-end="url(#arrow-ink)"/>
  <rect x="752" y="294" width="50" height="12" class="label-bg"/>
  <text x="755" y="303" class="label">sql · rls</text>

  <!-- ══════════════════════════════════════════════════════════════════
       ROW 3 (y=464–584)  —  Application plane: Web ─→ Azure ─── LiveKit
       Columns:  48–328 (Web) / 376–696 (Azure) / 744–1024 (LiveKit)
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Web (Next.js server) -->
  <g>
    <rect x="48" y="464" width="280" height="120" rx="14" class="paper"/>
    <text x="64" y="490" class="num">№ 05 · APPLICATION</text>
    <text x="64" y="516" class="title">Next.js 15 server (web)</text>
    <line x1="64" y1="530" x2="312" y2="530" class="hairline"/>
    <text x="64" y="548" class="body" fill="#2a2722">App Router · Server Actions</text>
    <text x="64" y="562" class="body" fill="#2a2722">/api/optimize-resume · /api/interview/*</text>
    <text x="64" y="576" class="body" fill="#2a2722">/api/storage/upload · /api/parse-resume</text>
  </g>

  <!-- Browser ↔ Web (SSR fetch — vertical, hugs left edge of Web column) -->
  <line x1="148" y1="232" x2="148" y2="464" class="hairline-strong" stroke-dasharray="3 4" marker-end="url(#arrow-ink)"/>
  <rect x="152" y="340" width="64" height="12" class="label-bg"/>
  <text x="155" y="349" class="label">ssr fetch</text>

  <!-- Web → PostgREST  (route up the right edge of Web col, through the gap between Web and Azure) -->
  <path d="M 328 484 L 350 484 L 350 360 L 544 360" class="hairline-strong" marker-end="url(#arrow-ink)"/>
  <rect x="356" y="412" width="60" height="12" class="label-bg"/>
  <text x="359" y="421" class="label">rls data</text>

  <!-- Web → Kong (auth flow — short hop up to Kong's bottom edge) -->
  <path d="M 248 464 L 248 240 L 360 240 L 360 232" class="hairline-strong" marker-end="url(#arrow-ink)"/>
  <rect x="252" y="280" width="36" height="12" class="label-bg"/>
  <text x="255" y="289" class="label">auth</text>

  <!-- Azure AI Foundry (LLM) -->
  <g>
    <rect x="376" y="464" width="320" height="120" rx="14" fill="#9c4a2c1f" stroke="#9c4a2c" stroke-width="1"/>
    <text x="392" y="490" class="num" fill="#9c4a2c">№ 06 · LLM PROVIDER</text>
    <text x="392" y="516" class="title">Azure AI Foundry</text>
    <line x1="392" y1="530" x2="680" y2="530" stroke="#9c4a2c" stroke-width="1" opacity="0.3"/>
    <text x="392" y="548" class="body" fill="#2a2722">truestar-gpt-5.3-chat · heavy tier</text>
    <text x="392" y="562" class="body" fill="#2a2722">truestar-gpt-5.4-mini · light tier</text>
    <text x="392" y="579" class="label" fill="#9c4a2c">LLM_PROVIDER=azure | anthropic (claude)</text>
  </g>

  <!-- Web → Azure (LLM call) -->
  <line x1="328" y1="544" x2="376" y2="544" class="accent-stroke" marker-end="url(#arrow-accent)"/>
  <rect x="332" y="532" width="40" height="12" class="label-bg"/>
  <text x="334" y="541" class="label" fill="#9c4a2c">llm</text>

  <!-- LiveKit Cloud -->
  <g>
    <rect x="744" y="464" width="280" height="120" rx="14" fill="#3a4f6e14" stroke="#3a4f6e" stroke-width="1"/>
    <text x="760" y="490" class="num" fill="#3a4f6e">EXTERNAL · CLOUD</text>
    <text x="760" y="516" class="title">LiveKit Cloud</text>
    <line x1="760" y1="530" x2="1008" y2="530" stroke="#3a4f6e" stroke-width="1" opacity="0.3"/>
    <text x="760" y="548" class="body" fill="#2a2722">WebRTC SFU · room JWT</text>
    <text x="760" y="562" class="body" fill="#2a2722">audio routing</text>
    <text x="760" y="579" class="label" fill="#3a4f6e">us-west-b</text>
  </g>

  <!-- Browser → LiveKit (WebRTC).  Routes along the very top of the row, then down the
       gap between Postgres (ends at x=992) and Legend (starts at x=1064) — corridor at x=1028. -->
  <path d="M 200 148 L 200 128 L 1028 128 L 1028 444 L 880 444 L 880 464" class="info-stroke" stroke-dasharray="4 4" marker-end="url(#arrow-info)"/>
  <rect x="540" y="120" width="92" height="14" class="label-bg"/>
  <text x="544" y="131" class="label" fill="#3a4f6e">browser webrtc</text>

  <!-- Web mints LiveKit room JWT — short top-hop into LiveKit box from Web column right edge -->
  <path d="M 328 504 L 360 504 L 360 444 L 800 444 L 800 464" class="info-stroke" stroke-dasharray="4 4" marker-end="url(#arrow-info)"/>
  <rect x="484" y="436" width="92" height="14" class="label-bg"/>
  <text x="488" y="447" class="label" fill="#3a4f6e">mint room jwt</text>

  <!-- ══════════════════════════════════════════════════════════════════
       ROW 4 (y=632–752)  —  Voice agent + external speech providers
       Columns:  48–328 (Agent) / 376–576 (Deepgram) / 600–800 (Cartesia) / 824–1024 (Anthropic)
       ══════════════════════════════════════════════════════════════════ -->

  <!-- Python Agent -->
  <g>
    <rect x="48" y="632" width="280" height="120" rx="14" class="paper"/>
    <text x="64" y="658" class="num">№ 07 · VOICE AGENT</text>
    <text x="64" y="684" class="title">Python · livekit-agents 1.5</text>
    <line x1="64" y1="698" x2="312" y2="698" class="hairline"/>
    <text x="64" y="716" class="body" fill="#2a2722">Deepgram Nova-3 STT (streaming)</text>
    <text x="64" y="730" class="body" fill="#2a2722">Claude Haiku 4.5 LLM</text>
    <text x="64" y="744" class="body" fill="#2a2722">Cartesia Sonic-2 TTS (streaming)</text>
  </g>

  <!-- Agent → Deepgram (right of Agent into Deepgram top) -->
  <path d="M 328 668 L 352 668 L 352 632 L 376 632" class="info-stroke" stroke-dasharray="4 4" marker-end="url(#arrow-info)"/>
  <!-- Agent → Cartesia -->
  <path d="M 328 700 L 352 700 L 352 612 L 700 612 L 700 632" class="info-stroke" stroke-dasharray="4 4" marker-end="url(#arrow-info)"/>
  <!-- Agent → Anthropic -->
  <path d="M 328 716 L 348 716 L 348 604 L 924 604 L 924 632" class="info-stroke" stroke-dasharray="4 4" marker-end="url(#arrow-info)"/>

  <!-- Agent → LiveKit (joins room).  Routes up between Agent column and the speech row
       to LiveKit's bottom-left, never crossing Cartesia/Deepgram/Anthropic. -->
  <path d="M 200 632 L 200 612 L 220 612 L 220 590 L 800 590 L 800 584" class="info-stroke" stroke-dasharray="4 4" marker-end="url(#arrow-info)"/>
  <rect x="384" y="582" width="120" height="14" class="label-bg"/>
  <text x="388" y="593" class="label" fill="#3a4f6e">join interview rooms</text>

  <!-- Agent → Postgres (transcript flush via PostgREST/service-role).  Down out of Agent's
       bottom edge, along bottom margin, up the far-right column to the gap between rows 1
       and 2 (y=276), then left into the Postgres bottom edge — clears Legend entirely. -->
  <path d="M 328 752 L 1248 752 L 1248 276 L 892 276 L 892 232" class="positive-stroke" stroke-dasharray="4 4" marker-end="url(#arrow-positive)"/>
  <rect x="476" y="744" width="200" height="14" class="label-bg"/>
  <text x="480" y="755" class="label" fill="#3f5c3a">transcript flush · service role</text>

  <!-- Deepgram -->
  <g>
    <rect x="376" y="632" width="200" height="120" rx="14" fill="#3a4f6e14" stroke="#3a4f6e" stroke-width="1"/>
    <text x="392" y="658" class="num" fill="#3a4f6e">EXTERNAL · STT</text>
    <text x="392" y="684" class="title">Deepgram</text>
    <text x="392" y="704" class="body" fill="#2a2722">Nova-3 streaming</text>
  </g>

  <!-- Cartesia -->
  <g>
    <rect x="600" y="632" width="200" height="120" rx="14" fill="#3a4f6e14" stroke="#3a4f6e" stroke-width="1"/>
    <text x="616" y="658" class="num" fill="#3a4f6e">EXTERNAL · TTS</text>
    <text x="616" y="684" class="title">Cartesia</text>
    <text x="616" y="704" class="body" fill="#2a2722">Sonic-2 streaming</text>
  </g>

  <!-- Anthropic -->
  <g>
    <rect x="824" y="632" width="200" height="120" rx="14" fill="#3a4f6e14" stroke="#3a4f6e" stroke-width="1"/>
    <text x="840" y="658" class="num" fill="#3a4f6e">EXTERNAL · LLM</text>
    <text x="840" y="684" class="title">Anthropic</text>
    <text x="840" y="704" class="body" fill="#2a2722">Claude Haiku 4.5 (agent)</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════════
       Legend (top-right corner, kept clear of all nodes)
       ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(1064, 148)">
    <text x="0" y="0" class="eyebrow">Legend</text>
    <line x1="0" y1="14" x2="168" y2="14" class="hairline"/>

    <line x1="0" y1="36" x2="28" y2="36" class="hairline-strong" marker-end="url(#arrow-ink)"/>
    <text x="38" y="40" class="body" fill="#555048">internal HTTP / SQL</text>

    <line x1="0" y1="58" x2="28" y2="58" class="accent-stroke" marker-end="url(#arrow-accent)"/>
    <text x="38" y="62" class="body" fill="#555048">LLM call</text>

    <line x1="0" y1="80" x2="28" y2="80" class="info-stroke" stroke-dasharray="4 4" marker-end="url(#arrow-info)"/>
    <text x="38" y="84" class="body" fill="#555048">WebRTC / external</text>

    <line x1="0" y1="102" x2="28" y2="102" class="positive-stroke" stroke-dasharray="4 4" marker-end="url(#arrow-positive)"/>
    <text x="38" y="106" class="body" fill="#555048">transcript persist</text>
  </g>

  <!-- decorative serif numeral bottom right -->
  <text x="1180" y="780" class="serif" font-style="italic" font-size="220" fill="#15140f08" letter-spacing="-0.05em" pointer-events="none">H</text>
</svg>
