<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Hyrd · Premium Career Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=JetBrains+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: var(--bg-sunk); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="screens-1.jsx"></script>
<script type="text/babel" src="screens-2.jsx"></script>
<script type="text/babel" src="screens-3.jsx"></script>
<script type="text/babel" src="screens-extra.jsx"></script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accentHue": 22,
  "density": "comfortable"
}/*EDITMODE-END*/;

function App() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    document.documentElement.setAttribute("data-theme", tw.theme);
    // Accent hue override (terracotta = 22 baseline). Convert to oklch.
    const accent = `oklch(0.55 0.13 ${tw.accentHue})`;
    const accentSoft = `oklch(0.55 0.13 ${tw.accentHue} / 0.12)`;
    document.documentElement.style.setProperty("--accent", accent);
    document.documentElement.style.setProperty("--accent-soft", accentSoft);
  }, [tw]);

  return (
    <>
      <DesignCanvas title="Hyrd · Editorial system" subtitle="10 screens · light primary · serif display + sans body">
        <DCSection id="hero" title="Hero screens">
          <DCArtboard id="optimizer-output" label="04 · Resume Optimizer — Output" width={1440} height={900}>
            <ScreenOptimizerOutput/>
          </DCArtboard>
          <DCArtboard id="kanban" label="05 · Job Tracker — Kanban" width={1440} height={900}>
            <ScreenKanban/>
          </DCArtboard>
          <DCArtboard id="interview-live" label="08 · AI Interview — Live" width={1440} height={900}>
            <ScreenInterviewLive/>
          </DCArtboard>
          <DCArtboard id="performance" label="09 · Performance Dashboard" width={1440} height={2400}>
            <ScreenPerformance/>
          </DCArtboard>
        </DCSection>

        <DCSection id="entry" title="Entry & home">
          <DCArtboard id="auth" label="01a · Sign in" width={1440} height={900}>
            <ScreenAuth/>
          </DCArtboard>
          <DCArtboard id="onboarding" label="01b · Onboarding" width={1440} height={900}>
            <ScreenOnboarding/>
          </DCArtboard>
          <DCArtboard id="dashboard" label="02 · Dashboard / Home" width={1440} height={1100}>
            <ScreenDashboard/>
          </DCArtboard>
        </DCSection>

        <DCSection id="resume" title="Resume optimizer">
          <DCArtboard id="opt-input" label="03 · Optimizer — Input" width={1440} height={900}>
            <ScreenOptimizerInput/>
          </DCArtboard>
          <DCArtboard id="opt-empty" label="03 · Empty state" width={1440} height={760}>
            <ScreenEmptyOptimizer/>
          </DCArtboard>
          <DCArtboard id="opt-loading" label="04 · Loading skeleton" width={1440} height={900}>
            <ScreenLoadingOptimizer/>
          </DCArtboard>
        </DCSection>

        <DCSection id="tracker" title="Tracker · drawer & detail">
          <DCArtboard id="job-detail" label="06 · Job Detail Drawer" width={1440} height={900}>
            <ScreenJobDetail/>
          </DCArtboard>
        </DCSection>

        <DCSection id="interview" title="AI Interview">
          <DCArtboard id="lobby" label="07 · Pre-call lobby" width={1440} height={900}>
            <ScreenInterviewLobby/>
          </DCArtboard>
        </DCSection>

        <DCSection id="settings" title="Settings & dark variant">
          <DCArtboard id="settings-screen" label="10 · Settings" width={1440} height={900}>
            <ScreenSettings/>
          </DCArtboard>
          <DCArtboard id="dashboard-dark" label="02 · Dashboard — Dark variant" width={1440} height={1100}>
            <ScreenDashboardDark/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Theme">
          <TweakRadio label="Mode" value={tw.theme} options={[{value:"light",label:"Light"},{value:"dark",label:"Dark"}]} onChange={(v) => setTweak("theme", v)}/>
        </TweakSection>
        <TweakSection title="Accent">
          <TweakSlider label="Hue" value={tw.accentHue} min={0} max={360} step={1} onChange={(v) => setTweak("accentHue", v)} />
          <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 6, marginTop: 6 }}>
            {[22, 12, 60, 140, 210, 290].map(h => (
              <button key={h} onClick={() => setTweak("accentHue", h)} aria-label={`hue ${h}`}
                style={{
                  height: 28, borderRadius: 6,
                  background: `oklch(0.55 0.13 ${h})`,
                  border: tw.accentHue === h ? "2px solid #fff" : "1px solid #ffffff20",
                  cursor: "pointer"
                }}/>
            ))}
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
