# Kong declarative config — routes /auth/v1 to GoTrue, /rest/v1 to PostgREST.
# This mimics Supabase Cloud's URL surface so the @supabase/supabase-js client works unchanged.
# We deliberately do NOT add Kong key-auth: PostgREST validates the JWT itself, and
# GoTrue uses bearer tokens for admin endpoints.

_format_version: "2.1"
_transform: true

services:
  - name: auth-v1
    url: http://gotrue:9999
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1
    plugins:
      - name: cors

  - name: rest-v1
    url: http://postgrest:3000
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1
    plugins:
      - name: cors
